# Netlify Configuration File
# Documents the build settings and redirects/headers for serving the static files.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"

[[redirects]]
  from = "/api/merkur-feed"
  to = "https://www.merkurxtip.rs/restapi/offer/sr/sport/S/mob?annex=0&desktopVersion=2.44.3.18&locale=sr"
  status = 200
  force = true

[[redirects]]
  from = "/api/verify-password"
  to = "/.netlify/functions/verify-password"
  status = 200
  force = true


